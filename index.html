<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://gkqpgnwmmwvdtpdcqwye.supabase.co; base-uri 'none'; form-action 'none'">
<title>Fahrgemeinschaft</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #4a5666;
    --line: #8a97a8;
    --soft-line: #d5dce4;
    --accent: #0b5cad;
    --accent-text: #ffffff;
    --ok-bg: #e6f4ea;
    --ok-text: #14532d;
    --warn-bg: #fff1c2;
    --warn-text: #5c3b00;
    --warn-line: #b57900;
    --err-bg: #fde8e8;
    --err-text: #7a1212;
    --err-line: #b42323;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 8px 0 4px; }
  h2 { font-size: 1.3rem; line-height: 1.3; margin: 0 0 4px; }
  h3 { font-size: 1.05rem; margin: 20px 0 8px; }
  p { margin: 0 0 12px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--soft-line);
    border-radius: 14px;
    padding: 18px 16px;
    margin: 16px 0;
  }
  .route { color: var(--muted); margin-bottom: 14px; }
  .status {
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 16px;
    background: #eef2f6;
    border: 2px solid var(--soft-line);
  }
  .status:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status .label { font-weight: 700; display: block; margin-bottom: 2px; }
  .status.ok { background: var(--ok-bg); color: var(--ok-text); border-color: #2f7d4f; }
  .status.open { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-line); font-weight: 700; }
  .status ul { margin: 8px 0 0; padding: 0; list-style: none; }
  .status li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid rgba(0,0,0,.15); }
  fieldset { border: 0; padding: 0; margin: 0 0 8px; min-width: 0; }
  legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
  .choice {
    display: flex; align-items: center; gap: 12px;
    min-height: 56px; padding: 10px 14px; margin: 0 0 8px;
    border: 2px solid var(--line); border-radius: 12px; background: #fff;
    cursor: pointer;
  }
  .choice:has(input:checked) { border-color: var(--accent); background: #e8f1fb; }
  .choice:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choice input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
  .panel { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--soft-line); }
  label.field { display: block; font-weight: 700; margin: 0 0 6px; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
  .zaehler { color: var(--muted); font-size: .9rem; text-align: right; margin: -10px 0 14px; }
  .anm { margin: 6px 0 0; padding: 2px 0 2px 10px; border-left: 3px solid var(--line); border-radius: 0; }
  .status .anm { border-left-color: currentColor; }
  select, input[type="text"], textarea {
    display: block; width: 100%; min-height: 52px;
    font: inherit; color: var(--text); background: #fff;
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px;
    margin: 0 0 14px;
  }
  select:focus, input[type="text"]:focus, textarea:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .hint { color: var(--muted); font-size: .95rem; margin: -8px 0 14px; }
  button {
    font: inherit; font-weight: 700; min-height: 52px; padding: 10px 20px;
    border-radius: 12px; border: 2px solid var(--accent);
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.secondary { background: #fff; color: var(--accent); }
  button.small { min-height: 48px; padding: 8px 16px; }
  button.wide { width: 100%; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button:disabled, select:disabled, input:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
  .offer { border: 2px solid var(--soft-line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
  .offer .name { font-weight: 700; }
  .offer .meta { color: var(--muted); margin: 2px 0 10px; }
  .msg { border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; font-weight: 700; }
  .msg.err { background: var(--err-bg); color: var(--err-text); border: 2px solid var(--err-line); }
  .msg.good { background: var(--ok-bg); color: var(--ok-text); border: 2px solid #2f7d4f; }
  .center { text-align: center; padding: 40px 8px; }
  .foot { color: var(--muted); font-size: .95rem; margin-top: 24px; }
  .sr { position: absolute; left: -9999px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background .15s; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="center">Einen Moment bitte.</p></main>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://gkqpgnwmmwvdtpdcqwye.supabase.co';
  var PUBLISHABLE_KEY = 'sb_publishable_1EraAljaYautx0yw-eLrsw_X25gwY2M';
  var RICHTUNGEN = ['hin', 'rueck'];
  var TITEL = { hin: 'Hinfahrt', rueck: 'Rückfahrt' };
  var STRECKE = {
    hin: 'Vom Abholort zum Bahnhof Meitingen',
    rueck: 'Vom Bahnhof Meitingen zum Zielort'
  };
  var MSG_UNGUELTIG = 'Dieser Link ist nicht gültig. Bitte nutze den Link, den du vom Elternbeirat bekommen hast.';
  var MSG_ALLGEMEIN = 'Das hat leider nicht geklappt. Bitte versuche es noch einmal.';
  var MSG_NETZ = 'Die Verbindung hat nicht geklappt. Bitte prüfe dein Internet und versuche es noch einmal.';

  // Token nur aus dem Fragment lesen, danach aus der Adresszeile entfernen.
  var token = null;
  try {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    var t = params.get('t');
    if (t && t.trim()) token = t.trim();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { /* ohne Token geht es unten weiter */ }

  var app = document.getElementById('app');
  var state = null;      // { kind, strecken: { hin, rueck } }
  var ui = {};           // Entwurf und Hinweise pro Richtung
  var busy = false;
  var focusId = null;

  // ---------- Hilfsfunktionen ----------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'checked' || k === 'required') { if (v) el[k] = true; }
      else el.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  function plural(n, eins, mehr) { return n + ' ' + (n === 1 ? eins : mehr); }

  // Ein Fahrer wird über seine Eltern angezeigt, z. B. "Mia K. oder Paul K.".
  // Sind keine Eltern bekannt, bleibt der Name des Kindes.
  function fahrerName(p) { return (p && p.eltern) ? p.eltern : ((p && p.name) || ''); }
  function fahrerMitKind(p) {
    return (p && p.eltern) ? p.eltern + ' (Kind: ' + (p.name || '') + ')' : ((p && p.name) || '');
  }

  async function rpc(name, body) {
    var res;
    try {
      res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'apikey': PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        referrerPolicy: 'no-referrer',
        cache: 'no-store'
      });
    } catch (e) {
      throw { kind: 'net', message: MSG_NETZ };
    }
    var data = null;
    try { var txt = await res.text(); data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
    if (!res.ok) {
      var meldung = MSG_ALLGEMEIN;
      // Nur bewusst geworfene Meldungen der Funktionen zeigen (Code P0001).
      if (data && data.code === 'P0001' && data.message) meldung = data.message;
      throw { kind: 'db', status: res.status, message: meldung };
    }
    return data;
  }

  // ---------- Zustand ----------
  function setStatus(data) {
    if (!data || !Array.isArray(data.strecken)) return false;
    var map = {};
    data.strecken.forEach(function (s) { if (s && s.richtung) map[s.richtung] = s; });
    RICHTUNGEN.forEach(function (r) {
      if (!map[r]) map[r] = { richtung: r, status: null };
    });
    state = { kind: data.kind || {}, strecken: map };
    return true;
  }

  function syncDraft(r) {
    var s = state.strecken[r];
    var u = ui[r];
    u.choice = s.status || null;
    u.plaetze = typeof s.plaetze_frei === 'number' ? s.plaetze_frei : 0;
    u.stationen = s.status === 'selbst' && s.stationen ? s.stationen : '';
    u.ort = s.status === 'suche' ? (s.ort_typ === 'wohnort' ? 'wohnort' : (s.ort_typ === 'anderer' ? 'anderer' : 'schule')) : 'schule';
    u.zielort = s.status === 'suche' && s.ort_typ === 'anderer' ? (s.ort_text || '') : '';
    u.treffpunkt = s.status === 'selbst' ? (s.ort_text || '') : '';
    u.anmerkung = s.anmerkung || '';
  }

  function initUi() {
    RICHTUNGEN.forEach(function (r) {
      ui[r] = { choice: null, plaetze: 0, stationen: '', ort: 'schule', zielort: '', treffpunkt: '', anmerkung: '', angebote: null, msg: null };
      syncDraft(r);
    });
  }

  // ---------- Aktionen ----------
  async function run(r, fn, opts) {
    if (busy) return;
    opts = opts || {};
    busy = true;
    ui[r].msg = null;
    render();
    try {
      var data = await fn();
      if (!setStatus(data)) {
        // Falls die Funktion keinen Status liefert, laden wir ihn neu.
        setStatus(await rpc('fg_mein_status', { p_token: token }));
      }
      if (opts.sync) syncDraft(r);
      if (opts.ok) ui[r].msg = { type: 'good', text: opts.ok };
      focusId = 'status-' + r;
      await ladeAngebote(r, true);
    } catch (e) {
      ui[r].msg = { type: 'err', text: e.message || MSG_ALLGEMEIN };
      focusId = 'msg-' + r;
    }
    busy = false;
    render();
  }

  async function ladeAngebote(r, stumm) {
    var s = state.strecken[r];
    if (s.status !== 'suche' && ui[r].choice !== 'suche') { ui[r].angebote = null; return; }
    if (!stumm) ui[r].msg = null;
    try {
      var list = await rpc('fg_angebote', { p_token: token, p_richtung: r });
      ui[r].angebote = Array.isArray(list) ? list : [];
    } catch (e) {
      ui[r].angebote = [];
      if (!stumm) ui[r].msg = { type: 'err', text: e.message };
      else ui[r].msg = { type: 'err', text: 'Die Angebote konnten nicht geladen werden. ' + e.message };
    }
  }

  var MAX_ANMERKUNG = 200;
  var MAX_ORT = 100;

  // Prüft die Eingaben für die gewählte Option. Gibt eine Meldung samt Ziel für den Fokus zurück.
  function pruefeEingaben(r, choice) {
    var u = ui[r];
    if (choice === 'selbst' && u.plaetze > 0 && !u.stationen.trim()) {
      return { text: 'Bitte gib an, welche Orte du anfährst.', fokus: 'stationen-' + r };
    }
    if (choice === 'suche' && u.ort === 'anderer' && !u.zielort.trim()) {
      return { text: 'Bitte gib den anderen Ort an.', fokus: 'zielort-' + r };
    }
    if (u.anmerkung.trim().length > MAX_ANMERKUNG) {
      return { text: 'Die Anmerkung ist zu lang. Es sind höchstens ' + MAX_ANMERKUNG + ' Zeichen erlaubt.', fokus: 'anmerkung-' + r };
    }
    return null;
  }

  // Baut die Angaben für fg_setze_option. Die neuen Felder werden nur gesendet, wenn sie gebraucht
  // werden. So bleibt die Seite auch dann lauffähig, wenn die Datenbank noch nicht erweitert ist.
  function optionBody(r, choice) {
    var u = ui[r];
    var s = state.strecken[r];
    var body = {
      p_token: token,
      p_richtung: r,
      p_status: choice,
      p_ort_typ: choice === 'suche' ? u.ort : 'schule',
      p_plaetze_frei: choice === 'selbst' ? u.plaetze : null,
      p_stationen: choice === 'selbst' && u.plaetze > 0 ? u.stationen.trim() : null
    };
    var ortText = '';
    if (choice === 'suche' && u.ort === 'anderer') ortText = u.zielort.trim();
    if (choice === 'selbst' && u.plaetze > 0) ortText = u.treffpunkt.trim();
    var anm = u.anmerkung.trim();
    if (ortText || anm || s.ort_text || s.anmerkung) {
      body.p_ort_text = ortText || null;
      body.p_anmerkung = anm || null;
    }
    return body;
  }

  function speichern(r) {
    var u = ui[r];
    if (!u.choice) return;
    var problem = pruefeEingaben(r, u.choice);
    if (problem) {
      u.msg = { type: 'err', text: problem.text };
      focusId = problem.fokus;
      render();
      return;
    }
    var body = optionBody(r, u.choice);
    run(r, function () { return rpc('fg_setze_option', body); }, { sync: true, ok: 'Gespeichert.' });
  }

  function buchen(r, fahrerId) {
    var s = state.strecken[r];
    var u = ui[r];
    var problem = pruefeEingaben(r, 'suche');
    if (problem) {
      u.msg = { type: 'err', text: problem.text };
      focusId = problem.fokus;
      render();
      return;
    }
    // Das Gesuch muss gespeichert sein, bevor ein Platz gebucht werden kann.
    var erstSpeichern = s.status !== 'suche'
      || (s.ort_typ || 'schule') !== u.ort
      || (u.ort === 'anderer' && (s.ort_text || '') !== u.zielort.trim())
      || (s.anmerkung || '') !== u.anmerkung.trim();
    var body = optionBody(r, 'suche');
    run(r, async function () {
      if (erstSpeichern) await rpc('fg_setze_option', body);
      return rpc('fg_buche', { p_token: token, p_richtung: r, p_fahrer_kind_id: fahrerId });
    }, { sync: true, ok: 'Dein Kind hat einen Platz.' });
  }

  async function aktualisieren(r) {
    if (busy) return;
    busy = true;
    ui[r].msg = null;
    render();
    await ladeAngebote(r, false);
    if (!ui[r].msg) ui[r].msg = { type: 'good', text: 'Die Liste ist aktuell.' };
    busy = false;
    focusId = 'aktualisieren-' + r;
    render();
  }

  function abgeben(r) {
    run(r, function () { return rpc('fg_storniere', { p_token: token, p_richtung: r }); },
      { ok: 'Der Platz ist wieder frei.' });
  }

  function entfernen(r, kindId) {
    run(r, function () {
      return rpc('fg_mitfahrer_entfernen', { p_token: token, p_richtung: r, p_kind_id: kindId });
    }, { ok: 'Die Mitfahrt wurde entfernt.' });
  }

  // ---------- Darstellung ----------
  function statusBox(r) {
    var s = state.strecken[r];
    var cls = 'status';
    var label = 'Stand';
    var body = [];

    if (!s.status) {
      body.push('Noch nichts angegeben.');
    } else if (s.status === 'selbst') {
      cls += ' ok';
      var n = s.plaetze_frei || 0;
      body.push(n > 0
        ? 'Du fährst selbst. ' + plural(n, 'Platz', 'Plätze') + ' frei.'
        : 'Du fährst selbst. Du nimmst niemanden mit.');
      if (n > 0 && s.stationen) body.push(h('div', { text: 'Orte: ' + s.stationen }));
      if (n > 0 && s.ort_text) body.push(h('div', { text: 'Anderer Treffpunkt: ' + s.ort_text }));
      if (s.anmerkung) body.push(h('div', { 'class': 'anm', text: 'Deine Anmerkung: ' + s.anmerkung }));
      var mit = Array.isArray(s.mitfahrende) ? s.mitfahrende : [];
      if (mit.length) {
        var ul = h('ul');
        mit.forEach(function (m, i) {
          var name = typeof m === 'string' ? m : (m.name || '');
          var id = (m && typeof m === 'object') ? (m.kind_id !== undefined ? m.kind_id : m.id) : null;
          var details = [h('span', { text: name + ((m && typeof m === 'object' && m.eltern) ? ' (Eltern: ' + m.eltern + ')' : '') })];
          if (m && typeof m === 'object') {
            if (m.ort) details.push(h('div', { text: (r === 'hin' ? 'Steigt zu bei: ' : 'Wird gebracht nach: ') + m.ort }));
            if (m.anmerkung) details.push(h('div', { 'class': 'anm', text: 'Anmerkung: ' + m.anmerkung }));
          }
          var li = h('li', null, [h('div', null, details)]);
          if (id !== null && id !== undefined) {
            li.appendChild(h('button', {
              type: 'button', 'class': 'secondary small', id: 'entf-' + r + '-' + i,
              'aria-label': name + ' entfernen', disabled: busy, text: 'Entfernen',
              onclick: function () { entfernen(r, id); }
            }));
          }
          ul.appendChild(li);
        });
        body.push(h('div', { 'class': 'label', text: 'Das fährt bei dir mit:', style: 'margin-top:10px' }));
        body.push(ul);
        if (mit.some(function (m) { return typeof m === 'string'; })) {
          body.push(h('div', { style: 'margin-top:8px', text: 'Zum Entfernen melde dich bitte beim Elternbeirat.' }));
        }
      }
    } else if (s.status === 'suche') {
      if (s.faehrt_mit) {
        cls += ' ok';
        var fname = fahrerName(s.faehrt_mit);
        var t = 'Fahrgemeinschaft steht. Dein Kind fährt bei ' + fahrerMitKind(s.faehrt_mit) + ' mit.';
        if (s.von && s.nach) t += ' Von ' + s.von + ' nach ' + s.nach + '.';
        if (s.faehrt_mit.stationen) t += ' Orte: ' + s.faehrt_mit.stationen + '.';
        body.push(t);
        if (s.faehrt_mit.ort_text) body.push(h('div', { text: 'Treffpunkt: ' + s.faehrt_mit.ort_text }));
        if (s.faehrt_mit.anmerkung) body.push(h('div', { 'class': 'anm', text: 'Anmerkung von ' + fname + ': ' + s.faehrt_mit.anmerkung }));
      } else {
        cls += ' open';
        body.push('Noch offen.');
      }
      if (s.anmerkung) body.push(h('div', { 'class': 'anm', text: 'Deine Anmerkung: ' + s.anmerkung }));
    } else if (s.status === 'anderweitig') {
      body.push('Keine Fahrgemeinschaft nötig.');
      if (s.anmerkung) body.push(h('div', { 'class': 'anm', text: 'Deine Anmerkung: ' + s.anmerkung }));
    }

    return h('div', { 'class': cls, id: 'status-' + r, tabindex: '-1' },
      [h('span', { 'class': 'label', text: 'Stand' })].concat(body));
  }

  function optionPanel(r) {
    var u = ui[r];
    var s = state.strecken[r];
    var kids = [];

    if (u.choice === 'selbst') {
      kids.push(h('label', { 'class': 'field', 'for': 'plaetze-' + r, text: 'Wie viele Plätze hast du frei?' }));
      var sel = h('select', {
        id: 'plaetze-' + r, disabled: busy,
        onchange: function (e) { u.plaetze = parseInt(e.target.value, 10); focusId = e.target.id; render(); }
      });
      for (var i = 0; i <= 8; i++) {
        var o = h('option', { value: String(i), text: i === 0 ? '0 (ich nehme niemanden mit)' : String(i) });
        if (i === u.plaetze) o.selected = true;
        sel.appendChild(o);
      }
      kids.push(sel);
      if (u.plaetze > 0) {
        kids.push(h('label', { 'class': 'field', 'for': 'stationen-' + r, text: 'Welche Orte fährst du an?' }));
        kids.push(h('input', {
          type: 'text', id: 'stationen-' + r, maxlength: '200', required: true,
          value: u.stationen, autocomplete: 'off', placeholder: 'zum Beispiel: Wertingen, Dillingen',
          disabled: busy,
          oninput: function (e) { u.stationen = e.target.value; }
        }));
        kids.push(h('label', { 'class': 'field', 'for': 'treffpunkt-' + r, text: 'Anderer Treffpunkt für Mitfahrende (freiwillig)' }));
        kids.push(h('input', {
          type: 'text', id: 'treffpunkt-' + r, maxlength: String(MAX_ORT),
          value: u.treffpunkt, autocomplete: 'off', placeholder: 'zum Beispiel: Parkplatz am Sportplatz',
          disabled: busy,
          oninput: function (e) { u.treffpunkt = e.target.value; }
        }));
      }
    } else if (u.choice === 'suche') {
      var frage = r === 'hin' ? 'Wo soll dein Kind abgeholt werden?' : 'Wohin soll dein Kind gebracht werden?';
      kids.push(h('label', { 'class': 'field', 'for': 'ort-' + r, text: frage }));
      var osel = h('select', {
        id: 'ort-' + r, disabled: busy,
        onchange: function (e) { u.ort = e.target.value; focusId = e.target.id; render(); }
      }, [
        h('option', { value: 'schule', text: 'Schule', selected: u.ort === 'schule' }),
        h('option', { value: 'wohnort', text: 'Mein Wohnort', selected: u.ort === 'wohnort' }),
        h('option', { value: 'anderer', text: 'Anderer Ort', selected: u.ort === 'anderer' })
      ]);
      kids.push(osel);
      if (u.ort === 'anderer') {
        kids.push(h('label', { 'class': 'field', 'for': 'zielort-' + r,
          text: r === 'hin' ? 'Wo genau soll dein Kind abgeholt werden?' : 'Wohin genau soll dein Kind gebracht werden?' }));
        kids.push(h('input', {
          type: 'text', id: 'zielort-' + r, maxlength: String(MAX_ORT), required: true,
          value: u.zielort, autocomplete: 'off', placeholder: 'zum Beispiel: Kirche in Rehling',
          disabled: busy,
          oninput: function (e) { u.zielort = e.target.value; }
        }));
      }
    } else if (u.choice === 'anderweitig') {
      kids.push(h('p', { 'class': 'hint', style: 'margin-top:0', text: 'Zum Beispiel, wenn dein Kind nicht mitfährt.' }));
    }

    if (u.choice) {
      var anmHinweis = u.choice === 'selbst'
        ? 'Alle Eltern, die dein Angebot sehen, lesen diesen Text. Schreib bitte keine Telefonnummern hinein.'
        : (u.choice === 'suche'
          ? 'Der Fahrer, bei dem dein Kind mitfährt, liest diesen Text. Schreib bitte keine Telefonnummern hinein.'
          : 'Nur der Elternbeirat liest diesen Text.');
      kids.push(h('label', { 'class': 'field', 'for': 'anmerkung-' + r,
        text: u.choice === 'anderweitig' ? 'Anmerkung (freiwillig)' : 'Anmerkung für andere Eltern (freiwillig)' }));
      var zaehler = h('div', { 'class': 'zaehler', id: 'anmerkung-zaehler-' + r, 'aria-hidden': 'true', text: u.anmerkung.length + ' von ' + MAX_ANMERKUNG + ' Zeichen' });
      kids.push(h('textarea', {
        id: 'anmerkung-' + r, maxlength: String(MAX_ANMERKUNG), rows: '3', disabled: busy,
        'aria-describedby': 'anmerkung-hinweis-' + r, text: u.anmerkung,
        oninput: function (e) { u.anmerkung = e.target.value; zaehler.textContent = u.anmerkung.length + ' von ' + MAX_ANMERKUNG + ' Zeichen'; }
      }));
      kids.push(zaehler);
      kids.push(h('p', { 'class': 'hint', id: 'anmerkung-hinweis-' + r, text: anmHinweis }));
    }

    if (u.choice) {
      kids.push(h('button', {
        type: 'button', 'class': 'wide', id: 'speichern-' + r, disabled: busy,
        onclick: function () { speichern(r); },
        text: busy ? 'Einen Moment bitte.' : 'Speichern'
      }));
    }

    // Angebote: sobald "suche" ausgewählt ist, auch ohne vorher zu speichern.
    if (u.choice === 'suche') {
      if (s.status === 'suche' && s.faehrt_mit) {
        kids.push(h('h3', { text: 'Dein Platz' }));
        kids.push(h('div', { 'class': 'offer' }, [
          h('div', { 'class': 'name', text: fahrerName(s.faehrt_mit) }),
          s.faehrt_mit.eltern ? h('div', { 'class': 'meta', text: 'Kind: ' + (s.faehrt_mit.name || '') }) : null,
          h('div', { 'class': 'meta', text: s.faehrt_mit.stationen ? 'Orte: ' + s.faehrt_mit.stationen : '' }),
          s.faehrt_mit.ort_text ? h('div', { 'class': 'meta', text: 'Treffpunkt: ' + s.faehrt_mit.ort_text }) : null,
          s.faehrt_mit.anmerkung ? h('div', { 'class': 'anm', text: s.faehrt_mit.anmerkung }) : null,
          h('button', {
            type: 'button', 'class': 'secondary wide', id: 'abgeben-' + r, disabled: busy,
            onclick: function () { abgeben(r); }, text: 'Platz abgeben'
          })
        ]));
      } else {
        kids.push(h('h3', { text: 'Freie Plätze' }));
        if (u.angebote === null) {
          kids.push(h('p', { text: 'Die Angebote werden geladen.' }));
        } else if (!u.angebote.length) {
          kids.push(h('p', { text: 'Im Moment ist kein Platz frei. Schau später noch einmal vorbei.' }));
        } else {
          kids.push(h('p', { 'class': 'hint', style: 'margin-top:0', text: 'Wenn du einen Platz nimmst, speichern wir dein Gesuch automatisch.' }));
          u.angebote.forEach(function (a, i) {
            kids.push(h('div', { 'class': 'offer' }, [
              h('div', { 'class': 'name', text: fahrerName(a) }),
              h('div', { 'class': 'meta', text: (a.stationen ? 'Orte: ' + a.stationen + '. ' : '') + plural(a.frei, 'Platz', 'Plätze') + ' frei.' }),
              a.ort_text ? h('div', { 'class': 'meta', text: 'Treffpunkt: ' + a.ort_text }) : null,
              a.anmerkung ? h('div', { 'class': 'anm', text: a.anmerkung }) : null,
              h('button', {
                type: 'button', 'class': 'wide', id: 'buche-' + r + '-' + i, disabled: busy || !(a.frei > 0),
                'aria-label': 'Platz nehmen bei ' + fahrerName(a),
                onclick: function () { buchen(r, a.kind_id); }, text: 'Platz nehmen'
              })
            ]));
          });
        }
        kids.push(h('button', {
          type: 'button', 'class': 'secondary wide', id: 'aktualisieren-' + r, disabled: busy,
          onclick: function () { aktualisieren(r); }, text: 'Liste aktualisieren'
        }));
      }
    }

    return kids.length ? h('div', { 'class': 'panel' }, kids) : null;
  }

  function card(r) {
    var u = ui[r];
    var optionen = [
      ['selbst', r === 'hin' ? 'Ich bringe mein Kind selbst' : 'Ich hole mein Kind selbst ab'],
      ['suche', 'Ich suche eine Mitfahrgelegenheit'],
      ['anderweitig', 'Ist anders geregelt']
    ];
    var fs = h('fieldset', null, [h('legend', { text: 'Was passt für dich?' })]);
    optionen.forEach(function (o) {
      fs.appendChild(h('label', { 'class': 'choice' }, [
        h('input', {
          type: 'radio', name: 'opt-' + r, value: o[0], id: 'opt-' + r + '-' + o[0],
          checked: u.choice === o[0], disabled: busy,
          onchange: function (e) {
            u.choice = e.target.value;
            u.msg = null;
            focusId = e.target.id;
            if (u.choice === 'suche' && !state.strecken[r].faehrt_mit) {
              u.angebote = null;
              ladeAngebote(r, false).then(render);
            }
            render();
          }
        }),
        h('span', { text: o[1] })
      ]));
    });

    var kids = [
      h('h2', { id: 'h-' + r, text: TITEL[r] }),
      h('p', { 'class': 'route', text: STRECKE[r] })
    ];
    if (u.msg) {
      kids.push(h('div', {
        'class': 'msg ' + u.msg.type, id: 'msg-' + r, tabindex: '-1',
        role: u.msg.type === 'err' ? 'alert' : 'status', text: u.msg.text
      }));
    }
    kids.push(statusBox(r));
    kids.push(fs);
    var panel = optionPanel(r);
    if (panel) kids.push(panel);
    return h('section', { 'class': 'card', 'aria-labelledby': 'h-' + r, 'aria-busy': busy ? 'true' : 'false' }, kids);
  }

  function render() {
    var a = document.activeElement;
    if (!focusId && a && a.id) focusId = a.id;
    app.textContent = '';

    if (!state) { return; }

    var k = state.kind || {};
    app.appendChild(h('h1', { text: 'Fahrgemeinschaft für ' + (k.name || 'dein Kind') }));
    app.appendChild(h('p', { 'class': 'sub', style: 'color:var(--text);font-weight:700;margin-bottom:6px', text: 'Hier organisieren wir die Fahrgemeinschaften für den Theaterausflug am 3. Dezember 2026.' }));
    app.appendChild(h('p', { 'class': 'sub', text: 'Alle Fahrten gehen von oder zum Bahnhof Meitingen. Gib für jede Strecke einzeln an, wie dein Kind fährt.' }));
    RICHTUNGEN.forEach(function (r) { app.appendChild(card(r)); });
    app.appendChild(h('p', { 'class': 'foot', text: 'Wenn du die Seite neu lädst, öffne bitte noch einmal deinen Link.' }));

    if (focusId) {
      var el = document.getElementById(focusId);
      if (el && !el.disabled) { el.focus({ preventScroll: false }); focusId = null; }
      else if (el && el.disabled) { /* beim nächsten Rendern erneut versuchen */ }
      else { focusId = null; }
    }
  }

  function zeigeFehlerSeite(text, mitNochmal) {
    app.textContent = '';
    var box = h('div', { 'class': 'card center' }, [h('p', { role: 'alert', text: text })]);
    if (mitNochmal) {
      box.appendChild(h('button', { type: 'button', onclick: start, text: 'Noch einmal versuchen' }));
    }
    app.appendChild(h('h1', { text: 'Fahrgemeinschaft' }));
    app.appendChild(box);
  }

  async function start() {
    if (!token) { zeigeFehlerSeite(MSG_UNGUELTIG, false); return; }
    app.textContent = '';
    app.appendChild(h('p', { 'class': 'center', text: 'Einen Moment bitte.' }));
    try {
      var data = await rpc('fg_mein_status', { p_token: token });
      if (!setStatus(data)) { zeigeFehlerSeite(MSG_UNGUELTIG, false); return; }
      initUi();
      for (var i = 0; i < RICHTUNGEN.length; i++) await ladeAngebote(RICHTUNGEN[i], true);
      render();
    } catch (e) {
      if (e.kind === 'net') zeigeFehlerSeite(e.message, true);
      else zeigeFehlerSeite(MSG_UNGUELTIG, false);
    }
  }

  start();
})();
</script>
</body>
</html>
