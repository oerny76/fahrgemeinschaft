<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://gkqpgnwmmwvdtpdcqwye.supabase.co; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b5cad">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Fahrgemeinschaft Übersicht</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2430; --muted: #4a5666;
    --line: #8a97a8; --soft-line: #d5dce4; --accent: #0b5cad; --accent-text: #ffffff;
    --ok-bg: #e6f4ea; --ok-text: #14532d; --ok-line: #2f7d4f;
    --warn-bg: #fff1c2; --warn-text: #5c3b00; --warn-line: #b57900;
    --none-bg: #eef2f6; --none-text: #33404f;
    --err-bg: #fde8e8; --err-text: #7a1212; --err-line: #b42323;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; line-height: 1.25; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  p { margin: 0 0 12px; }
  .sub { color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 16px 0; }
  .bar label { display: block; font-weight: 700; margin-bottom: 4px; }
  select, input[type="search"] { min-height: 48px; font: inherit; color: var(--text); background: #fff;
    border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 220px; }
  select:focus, input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button { font: inherit; font-weight: 700; min-height: 48px; padding: 8px 18px; border-radius: 10px;
    border: 2px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .spacer { flex: 1; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--soft-line); border-radius: 12px; padding: 12px 14px; }
  .tile .num { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
  .tile .lbl { color: var(--muted); }
  .tile.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); color: var(--warn-text); }
  .tile.warn .lbl { color: var(--warn-text); }
  .scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--soft-line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  caption { text-align: left; padding: 10px 12px; font-weight: 700; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--soft-line); }
  thead th { background: #e9eef3; position: sticky; top: 0; }
  tbody th { font-weight: 700; }
  .meta { color: var(--muted); font-weight: 400; display: block; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 700; border: 2px solid transparent; margin-bottom: 4px; }
  .b-none { background: var(--none-bg); color: var(--none-text); border-color: var(--line); }
  .b-selbst { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-line); }
  .b-gefunden { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-line); }
  .b-suche { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-line); }
  .b-anders { background: #e8f1fb; color: #0a3d75; border-color: var(--accent); }
  .detail { display: block; }
  .msg { border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-weight: 700; }
  .msg.err { background: var(--err-bg); color: var(--err-text); border: 2px solid var(--err-line); }
  .msg.good { background: var(--ok-bg); color: var(--ok-text); border: 2px solid var(--ok-line); }
  .center { text-align: center; padding: 40px 8px; }
  .empty { padding: 24px 12px; }
  .login { max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--soft-line);
    border-radius: 14px; padding: 18px 16px; }
  .login input[type="text"] { width: 100%; min-height: 52px; font: inherit; color: var(--text); background: #fff;
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0 14px;
    -webkit-text-security: disc; }
  .login label.field { font-weight: 700; display: block; }
  .login .check { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 14px; }
  .login .check input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
  .login button { width: 100%; min-height: 52px; }
  button.small { min-height: 40px; padding: 4px 12px; font-size: .9rem; margin-top: 6px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: calc(100% - 24px); max-width: 480px;
    color: var(--text); background: var(--card); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin-top: 0; }
  dialog fieldset { border: 0; padding: 0; margin: 0 0 8px; min-width: 0; }
  dialog legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; margin: 0 0 8px;
    border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); background: #e8f1fb; }
  .opt:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
  dialog label.field { display: block; font-weight: 700; margin: 12px 0 4px; }
  dialog select, dialog input[type="text"], dialog textarea { width: 100%; min-width: 0; display: block; min-height: 48px;
    font: inherit; color: var(--text); background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  dialog textarea { min-height: 88px; resize: vertical; line-height: 1.4; }
  dialog select:focus, dialog input:focus, dialog textarea:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  dialog .zaehler { color: var(--muted); font-size: .9rem; text-align: right; margin-top: 2px; }
  dialog .hint { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
  .anm { display: block; margin-top: 4px; padding-left: 8px; border-left: 3px solid var(--line); border-radius: 0; }
  .pnl { border-top: 1px solid var(--soft-line); margin-top: 8px; padding-top: 4px; }
  .btnrow { display: flex; gap: 10px; margin-top: 16px; }
  .btnrow button { flex: 1; }
  .mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--soft-line); }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="center">Einen Moment bitte.</p></main>
<dialog id="editor" aria-labelledby="ed-titel"></dialog>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://gkqpgnwmmwvdtpdcqwye.supabase.co';
  var PUBLISHABLE_KEY = 'sb_publishable_1EraAljaYautx0yw-eLrsw_X25gwY2M';
  var MSG_UNGUELTIG = 'Dieser Link ist nicht gültig. Bitte nutze den Admin-Link, den du bekommen hast.';
  var MSG_NETZ = 'Die Verbindung hat nicht geklappt. Bitte prüfe dein Internet und versuche es noch einmal.';
  var MSG_FEHLT = 'Die Datenbankfunktion für die Übersicht fehlt noch. Bitte spiele zuerst die Datei fg_admin_uebersicht.sql in Supabase ein.';

  var SPEICHER_KEY = 'fg_admin_code';
  function liesGespeichert() { try { return localStorage.getItem(SPEICHER_KEY) || null; } catch (e) { return null; } }
  function speichere(c) { try { localStorage.setItem(SPEICHER_KEY, c); } catch (e) { /* ohne Speicher: nur für diese Sitzung */ } }
  function vergiss() { try { localStorage.removeItem(SPEICHER_KEY); } catch (e) { /* nichts zu tun */ } }

  // Woher kommt der Code? 'fragment' (Link), 'gespeichert' (Gerät) oder 'eingabe' (Formular).
  var token = null;
  var quelle = null;
  var merken = false;
  try {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    var t = params.get('a');
    if (t && t.trim()) { token = t.trim(); quelle = 'fragment'; }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { /* ohne Code geht es unten weiter */ }
  if (!token) {
    var g = liesGespeichert();
    if (g) { token = g; quelle = 'gespeichert'; }
  }

  // Erlaubt auch das Einfügen des ganzen Links.
  function extrahiereCode(text) {
    var s = String(text || '').trim();
    var m = s.match(/[#&?]a=([^&\s]+)/);
    return (m ? m[1] : s).trim();
  }

  var app = document.getElementById('app');
  var rows = null;       // abgeleitete Zeilen
  var stand = null;      // Zeitpunkt des letzten Ladens
  var filter = 'alle';
  var suche = '';
  var busy = false;
  var meldung = null;

  // ---------- Hilfsfunktionen ----------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'selected') { if (v) el[k] = true; }
      else el.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  async function rpc(name, body) {
    var res;
    try {
      res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'apikey': PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body), referrerPolicy: 'no-referrer', cache: 'no-store'
      });
    } catch (e) { throw { kind: 'net', message: MSG_NETZ }; }
    var data = null;
    try { var txt = await res.text(); data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
    if (!res.ok) {
      if (data && data.code === 'P0001') {
        var m = String(data.message || '');
        if (/Ungültiger Zugangslink/.test(m)) throw { kind: 'ungueltig', message: MSG_UNGUELTIG };
        throw { kind: 'regel', message: m || 'Das hat leider nicht geklappt. Bitte versuche es noch einmal.' };
      }
      if (data && data.code === 'PGRST202') throw { kind: 'fehlt', message: MSG_FEHLT };
      throw { kind: 'db', message: 'Das hat leider nicht geklappt. Bitte versuche es noch einmal.' };
    }
    return data;
  }

  function fmtZeit(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  // ---------- Daten ableiten ----------
  function leiteAb(s) {
    s = s || {};
    var mitRoh = Array.isArray(s.mitfahrende) ? s.mitfahrende : [];
    var mit = mitRoh.map(function (m) { return typeof m === 'string' ? m : ((m && m.name) || ''); });
    var mitIds = mitRoh.map(function (m) { return (m && typeof m === 'object' && m.kind_id) ? m.kind_id : null; });
    var art = 'none';
    if (s.status === 'selbst') art = 'selbst';
    else if (s.status === 'suche') art = s.faehrt_mit ? 'gefunden' : 'suche';
    else if (s.status === 'anderweitig') art = 'anders';
    var angeboten = s.status === 'selbst' ? (s.plaetze_frei || 0) : 0;
    return {
      art: art,
      angeboten: angeboten,
      belegt: mit.length,
      frei: Math.max(0, angeboten - mit.length),
      orte: s.stationen || '',
      ortTyp: s.status === 'suche'
        ? (s.ort_typ === 'wohnort' ? 'Wohnort' : (s.ort_typ === 'anderer' ? 'Anderer Ort: ' + (s.ort_text || '') : 'Schule'))
        : '',
      ortText: s.ort_text || '',
      anmerkung: s.anmerkung || '',
      faehrtMit: s.faehrt_mit || '',
      mitfahrende: mit,
      mitIds: mitIds,
      faehrtMitId: s.faehrt_mit_id || null,
      ortRaw: s.ort_typ === 'wohnort' ? 'wohnort' : (s.status === 'suche' && s.ort_typ === 'anderer' ? 'anderer' : 'schule'),
      zeit: s.aktualisiert_am || null
    };
  }

  var ART_TEXT = {
    none: 'Noch nichts angegeben',
    selbst: 'Fährt selbst',
    gefunden: 'Platz gefunden',
    suche: 'Sucht noch einen Platz',
    anders: 'Anders geregelt'
  };

  function baueZeilen(data) {
    return (Array.isArray(data) ? data : []).map(function (k) {
      var st = k.strecken || {};
      var hin = leiteAb(st.hin), rueck = leiteAb(st.rueck);
      var zeiten = [hin.zeit, rueck.zeit].filter(Boolean).sort();
      return {
        id: k.kind_id, name: k.name || '', jahrgang: k.jahrgang, ort: k.ort || '',
        hin: hin, rueck: rueck,
        zuletzt: zeiten.length ? zeiten[zeiten.length - 1] : null,
        angabe: hin.art !== 'none' || rueck.art !== 'none'
      };
    });
  }

  function passt(z) {
    if (suche && z.name.toLowerCase().indexOf(suche.toLowerCase()) === -1) return false;
    if (filter === 'nichts') return !z.angabe;
    if (filter === 'unvollstaendig') return z.hin.art === 'none' || z.rueck.art === 'none';
    if (filter === 'suche_offen') return z.hin.art === 'suche' || z.rueck.art === 'suche';
    if (filter === 'plaetze_frei') return z.hin.frei > 0 || z.rueck.frei > 0;
    return true;
  }

  // ---------- CSV ----------
  function csvFeld(v) {
    var s = v === null || v === undefined ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // Schutz vor Formeln in Excel
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function csvErzeugen(liste) {
    var kopf = ['Kind', 'Jahrgang', 'Wohnort', 'Etwas angegeben'];
    ['Hinfahrt', 'Rückfahrt'].forEach(function (p) {
      kopf.push(p + ' Stand', p + ' Plätze angeboten', p + ' Plätze noch frei', p + ' Orte', p + ' Treffpunkt',
        p + ' Abholort bzw. Zielort', p + ' Fährt mit', p + ' Mitfahrende', p + ' Anmerkung');
    });
    kopf.push('Zuletzt geändert');
    var zeilen = [kopf];
    liste.forEach(function (z) {
      var r = [z.name, z.jahrgang, z.ort, z.angabe ? 'ja' : 'nein'];
      [z.hin, z.rueck].forEach(function (s) {
        r.push(ART_TEXT[s.art], s.art === 'selbst' ? s.angeboten : '', s.art === 'selbst' ? s.frei : '',
          s.orte, s.art === 'selbst' ? s.ortText : '', s.ortTyp, s.faehrtMit, s.mitfahrende.join(', '), s.anmerkung);
      });
      r.push(fmtZeit(z.zuletzt));
      zeilen.push(r);
    });
    return '﻿' + zeilen.map(function (r) { return r.map(csvFeld).join(';'); }).join('\r\n') + '\r\n';
  }

  function exportieren() {
    var liste = rows.filter(passt);
    var blob = new Blob([csvErzeugen(liste)], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var p2 = function (n) { return String(n).padStart(2, '0'); };
    var a = h('a', { href: url, download: 'fahrgemeinschaft-stand-' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.csv' });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    meldung = { type: 'good', text: 'Die CSV mit ' + liste.length + ' Kindern wurde erstellt.' };
    render();
  }

  // ---------- Darstellung ----------
  function zelle(s, z, r) {
    var kids = [h('span', { 'class': 'badge b-' + s.art, text: ART_TEXT[s.art] })];
    if (s.art === 'selbst') {
      kids.push(h('span', { 'class': 'detail', text: s.angeboten > 0
        ? s.angeboten + ' Plätze angeboten, noch ' + s.frei + ' frei' : 'Nimmt niemanden mit' }));
      if (s.orte) kids.push(h('span', { 'class': 'detail', text: 'Orte: ' + s.orte }));
      if (s.ortText) kids.push(h('span', { 'class': 'detail', text: 'Treffpunkt: ' + s.ortText }));
      if (s.mitfahrende.length) kids.push(h('span', { 'class': 'detail', text: 'Mit dabei: ' + s.mitfahrende.join(', ') }));
    } else if (s.art === 'gefunden' || s.art === 'suche') {
      kids.push(h('span', { 'class': 'detail', text: (s.ortTyp ? 'Ort: ' + s.ortTyp : '') }));
      if (s.faehrtMit) kids.push(h('span', { 'class': 'detail', text: 'Fährt mit ' + s.faehrtMit }));
    }
    if (s.anmerkung) kids.push(h('span', { 'class': 'anm', text: 'Anmerkung: ' + s.anmerkung }));
    kids.push(h('button', {
      type: 'button', 'class': 'secondary small', id: 'aendern-' + z.id + '-' + r, disabled: busy,
      'aria-label': (r === 'hin' ? 'Hinfahrt' : 'Rückfahrt') + ' von ' + z.name + ' ändern',
      onclick: function () { oeffneEditor(z.id, r); }, text: 'Ändern'
    }));
    return h('td', null, kids);
  }

  function kachel(zahl, text, warn) {
    return h('div', { 'class': 'tile' + (warn ? ' warn' : '') }, [
      h('div', { 'class': 'num', text: String(zahl) }), h('div', { 'class': 'lbl', text: text })
    ]);
  }

  function zaehle(fn) { return rows.filter(fn).length; }
  function summe(fn) { return rows.reduce(function (a, z) { return a + fn(z); }, 0); }

  function render() {
    var fokus = document.activeElement && document.activeElement.id;
    app.textContent = '';
    if (!rows) return;

    var offenHin = zaehle(function (z) { return z.hin.art === 'suche'; });
    var offenRueck = zaehle(function (z) { return z.rueck.art === 'suche'; });

    app.appendChild(h('h1', { text: 'Fahrgemeinschaft Übersicht' }));
    app.appendChild(h('p', { 'class': 'sub', text: 'Theaterausflug am 3. Dezember 2026. Stand: ' + fmtZeit(stand.toISOString()) + ' Uhr.' }));

    if (meldung) app.appendChild(h('div', { 'class': 'msg ' + meldung.type, role: meldung.type === 'err' ? 'alert' : 'status', text: meldung.text }));

    app.appendChild(h('div', { 'class': 'tiles' }, [
      kachel(rows.length, 'Kinder insgesamt'),
      kachel(zaehle(function (z) { return z.hin.art !== 'none' && z.rueck.art !== 'none'; }), 'Beide Strecken angegeben'),
      kachel(zaehle(function (z) { return z.angabe && (z.hin.art === 'none' || z.rueck.art === 'none'); }), 'Nur eine Strecke angegeben'),
      kachel(zaehle(function (z) { return !z.angabe; }), 'Noch nichts angegeben', zaehle(function (z) { return !z.angabe; }) > 0),
      kachel(offenHin, 'Hinfahrt: suchen noch einen Platz', offenHin > 0),
      kachel(offenRueck, 'Rückfahrt: suchen noch einen Platz', offenRueck > 0),
      kachel(summe(function (z) { return z.hin.frei; }), 'Hinfahrt: freie Plätze'),
      kachel(summe(function (z) { return z.rueck.frei; }), 'Rückfahrt: freie Plätze')
    ]));

    var sel = h('select', { id: 'filter', onchange: function (e) { filter = e.target.value; render(); } });
    [['alle', 'Alle Kinder'], ['nichts', 'Noch nichts angegeben'], ['unvollstaendig', 'Mindestens eine Strecke fehlt'],
     ['suche_offen', 'Suchen noch einen Platz'], ['plaetze_frei', 'Haben noch freie Plätze']].forEach(function (o) {
      sel.appendChild(h('option', { value: o[0], text: o[1], selected: filter === o[0] }));
    });
    var liste = rows.filter(passt);

    app.appendChild(h('div', { 'class': 'bar' }, [
      h('div', null, [h('label', { 'for': 'filter', text: 'Anzeigen' }), sel]),
      h('div', null, [h('label', { 'for': 'suche', text: 'Name suchen' }),
        h('input', { type: 'search', id: 'suche', value: suche, autocomplete: 'off',
          oninput: function (e) { suche = e.target.value; render(); } })]),
      h('span', { 'class': 'spacer' }),
      h('button', { type: 'button', 'class': 'secondary', id: 'aktualisieren', disabled: busy,
        onclick: laden, text: busy ? 'Einen Moment bitte.' : 'Aktualisieren' }),
      h('button', { type: 'button', 'class': 'secondary', id: 'abmelden', disabled: busy,
        onclick: abmelden, text: 'Abmelden' }),
      h('button', { type: 'button', id: 'export', disabled: busy || !liste.length,
        onclick: exportieren, text: 'CSV exportieren (' + liste.length + ')' })
    ]));

    var tbody = h('tbody');
    if (!liste.length) {
      tbody.appendChild(h('tr', null, [h('td', { colspan: '4', 'class': 'empty', text: 'Keine Kinder gefunden.' })]));
    }
    liste.forEach(function (z) {
      tbody.appendChild(h('tr', null, [
        h('th', { scope: 'row' }, [z.name, h('span', { 'class': 'meta', text: 'Jahrgang ' + z.jahrgang + (z.ort ? ', ' + z.ort : '') })]),
        zelle(z.hin, z, 'hin'), zelle(z.rueck, z, 'rueck'),
        h('td', { text: z.zuletzt ? fmtZeit(z.zuletzt) : 'Noch nie' })
      ]));
    });

    app.appendChild(h('div', { 'class': 'scroll' }, [
      h('table', null, [
        h('caption', { text: liste.length + ' von ' + rows.length + ' Kindern' }),
        h('thead', null, [h('tr', null, [
          h('th', { scope: 'col', text: 'Kind' }), h('th', { scope: 'col', text: 'Hinfahrt' }),
          h('th', { scope: 'col', text: 'Rückfahrt' }), h('th', { scope: 'col', text: 'Zuletzt geändert' })
        ])]),
        tbody
      ])
    ]));

    if (fokus) {
      var el = document.getElementById(fokus);
      if (el) {
        el.focus();
        if (fokus === 'suche' && el.setSelectionRange) { var n = el.value.length; el.setSelectionRange(n, n); }
      }
    }
  }

  function zeigeFehlerSeite(text, nochmal) {
    app.textContent = '';
    app.appendChild(h('h1', { text: 'Fahrgemeinschaft Übersicht' }));
    var box = h('div', { 'class': 'center' }, [h('p', { role: 'alert', text: text })]);
    if (nochmal) box.appendChild(h('button', { type: 'button', onclick: laden, text: 'Noch einmal versuchen' }));
    app.appendChild(box);
  }

  function zeigeLogin(fehler) {
    app.textContent = '';
    app.appendChild(h('h1', { text: 'Fahrgemeinschaft Übersicht' }));
    app.appendChild(h('p', { 'class': 'sub', text: 'Theaterausflug am 3. Dezember 2026.' }));

    var feld = h('input', {
      type: 'text', id: 'code', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off',
      spellcheck: 'false', inputmode: 'text', 'aria-describedby': fehler ? 'login-fehler' : null,
      'aria-invalid': fehler ? 'true' : null
    });
    var haken = h('input', { type: 'checkbox', id: 'merken', checked: 'checked' });
    haken.checked = true;
    var tasteAnmelden = h('button', { type: 'submit', id: 'anmelden', text: 'Anmelden' });

    var form = h('form', { 'class': 'login', novalidate: 'novalidate' }, [
      fehler ? h('div', { 'class': 'msg err', id: 'login-fehler', role: 'alert', text: fehler }) : null,
      h('label', { 'class': 'field', 'for': 'code', text: 'Admin-Code' }),
      feld,
      h('label', { 'class': 'check', 'for': 'merken' }, [haken, h('span', { text: 'Auf diesem Gerät angemeldet bleiben' })]),
      tasteAnmelden
    ]);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var code = extrahiereCode(feld.value);
      if (!code) { zeigeLogin('Bitte gib deinen Admin-Code ein.'); return; }
      token = code; quelle = 'eingabe'; merken = haken.checked;
      laden();
    });
    app.appendChild(form);
    feld.focus();
  }

  function abmelden() {
    vergiss();
    token = null; quelle = null; rows = null; meldung = null; suche = ''; filter = 'alle';
    zeigeLogin();
  }

  async function laden() {
    if (busy) return;
    if (!token) { zeigeLogin(); return; }
    busy = true; meldung = null;
    if (rows) render();
    try {
      var data = await rpc('fg_admin_uebersicht', { p_admin_token: token });
      rows = baueZeilen(data);
      stand = new Date();
      busy = false;
      if (quelle === 'eingabe' && merken) speichere(token);
      render();
    } catch (e) {
      busy = false;
      if (e.kind === 'ungueltig') { codeUngueltig(); return; }
      if (rows) { meldung = { type: 'err', text: e.message }; render(); }
      else zeigeFehlerSeite(e.message, e.kind === 'net' || e.kind === 'db' || e.kind === 'regel');
    }
  }

  function codeUngueltig() {
    var war = quelle;
    schliesseEditor();
    token = null; quelle = null; rows = null;
    if (war === 'gespeichert') {
      vergiss();
      zeigeLogin('Der gespeicherte Code gilt nicht mehr. Bitte gib den Code noch einmal ein.');
    } else if (war === 'eingabe') {
      zeigeLogin('Dieser Code ist nicht gültig. Bitte prüfe ihn und versuche es noch einmal.');
    } else {
      zeigeLogin(MSG_UNGUELTIG + ' Du kannst den Code auch hier eingeben.');
    }
  }

  // ---------- Manuelle Eingabe ----------
  var dlg = document.getElementById('editor');
  var ed = null;   // { id, r, choice, plaetze, orte, ort, fahrer, msg, busy }
  // Das close-Ereignis kommt asynchron. Nur zurücksetzen, wenn der Dialog nicht schon wieder offen ist.
  dlg.addEventListener('close', function () { if (!dlg.open) ed = null; });
  function schliesseEditor() { ed = null; if (dlg.open) dlg.close(); }

  function findRow(id) {
    for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
    return null;
  }

  function fahrerListe(z, r) {
    var aktuell = z[r].faehrtMitId;
    var out = [];
    rows.forEach(function (x) {
      if (x.id === z.id) return;
      var f = x[r];
      if (f.art === 'selbst' && (f.frei > 0 || x.id === aktuell)) out.push({ id: x.id, name: x.name, frei: f.frei });
    });
    return out;
  }

  function oeffneEditor(id, r) {
    var z = findRow(id);
    if (!z) return;
    var s = z[r];
    var map = { selbst: 'selbst', suche: 'suche', gefunden: 'suche', anders: 'anderweitig' };
    ed = {
      id: id, r: r, choice: map[s.art] || null,
      plaetze: s.art === 'selbst' ? s.angeboten : 0,
      orte: s.art === 'selbst' ? s.orte : '',
      ort: s.ortRaw,
      zielort: s.ortRaw === 'anderer' ? s.ortText : '',
      treffpunkt: s.art === 'selbst' ? s.ortText : '',
      anmerkung: s.anmerkung,
      fahrer: s.faehrtMitId || '',
      msg: null, busy: false
    };
    renderEditor('ed-opt-' + (ed.choice || 'selbst'));
    if (!dlg.open) dlg.showModal();
    var f = document.getElementById('ed-opt-' + (ed.choice || 'selbst'));
    if (f) f.focus();
  }

  function renderEditor(fokusId) {
    if (!ed) return;
    var z = findRow(ed.id);
    if (!z) { schliesseEditor(); return; }
    var s = z[ed.r];
    var aktiv = fokusId || (document.activeElement && dlg.contains(document.activeElement) ? document.activeElement.id : null);
    var b = ed.busy;
    dlg.textContent = '';

    dlg.appendChild(h('h2', { id: 'ed-titel', text: (ed.r === 'hin' ? 'Hinfahrt' : 'Rückfahrt') + ' für ' + z.name }));
    dlg.appendChild(h('p', { 'class': 'sub', text: 'Jetzt: ' + ART_TEXT[s.art] + '. Die Familie sieht die Änderung auf ihrer Seite.' }));
    if (ed.msg) dlg.appendChild(h('div', { 'class': 'msg ' + ed.msg.type, id: 'ed-msg', tabindex: '-1', role: ed.msg.type === 'err' ? 'alert' : 'status', text: ed.msg.text }));

    var fs = h('fieldset', null, [h('legend', { text: 'Was gilt für diese Strecke?' })]);
    [['selbst', 'Fährt selbst'], ['suche', 'Sucht einen Platz'], ['anderweitig', 'Anders geregelt']].forEach(function (o) {
      var radio = h('input', { type: 'radio', name: 'ed-opt', id: 'ed-opt-' + o[0], value: o[0], disabled: b,
        onchange: function (e) { ed.choice = e.target.value; ed.msg = null; renderEditor(e.target.id); } });
      if (ed.choice === o[0]) radio.checked = true;
      fs.appendChild(h('label', { 'class': 'opt' }, [radio, h('span', { text: o[1] })]));
    });
    dlg.appendChild(fs);

    var pnl = h('div', { 'class': 'pnl' });
    if (ed.choice === 'selbst') {
      pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-plaetze', text: 'Wie viele Plätze sind frei?' }));
      var sel = h('select', { id: 'ed-plaetze', disabled: b, onchange: function (e) { ed.plaetze = parseInt(e.target.value, 10); renderEditor(e.target.id); } });
      for (var i = 0; i <= 8; i++) {
        var o = h('option', { value: String(i), text: i === 0 ? '0 (nimmt niemanden mit)' : String(i) });
        if (i === ed.plaetze) o.selected = true;
        sel.appendChild(o);
      }
      pnl.appendChild(sel);
      if (ed.plaetze > 0) {
        pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-orte', text: 'Welche Orte werden angefahren?' }));
        pnl.appendChild(h('input', { type: 'text', id: 'ed-orte', maxlength: '200', value: ed.orte, autocomplete: 'off',
          placeholder: 'zum Beispiel: Wertingen, Dillingen', disabled: b, oninput: function (e) { ed.orte = e.target.value; } }));
        pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-treffpunkt', text: 'Anderer Treffpunkt (freiwillig)' }));
        pnl.appendChild(h('input', { type: 'text', id: 'ed-treffpunkt', maxlength: '100', value: ed.treffpunkt, autocomplete: 'off',
          placeholder: 'zum Beispiel: Parkplatz am Sportplatz', disabled: b, oninput: function (e) { ed.treffpunkt = e.target.value; } }));
      }
      if (s.mitfahrende.length) {
        pnl.appendChild(h('div', { 'class': 'fl', style: 'font-weight:700;margin-top:14px', text: 'Mitfahrende' }));
        s.mitfahrende.forEach(function (name, idx) {
          var mid = s.mitIds[idx];
          pnl.appendChild(h('div', { 'class': 'mrow' }, [
            h('span', { text: name }),
            mid ? h('button', { type: 'button', 'class': 'secondary small', id: 'ed-entf-' + idx, disabled: b,
              'aria-label': name + ' entfernen', onclick: function () { mitfahrerEntfernen(mid, name); }, text: 'Entfernen' }) : null
          ]));
        });
      }
    } else if (ed.choice === 'suche') {
      pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-ort',
        text: ed.r === 'hin' ? 'Wo soll das Kind abgeholt werden?' : 'Wohin soll das Kind gebracht werden?' }));
      pnl.appendChild(h('select', { id: 'ed-ort', disabled: b, onchange: function (e) { ed.ort = e.target.value; renderEditor(e.target.id); } }, [
        h('option', { value: 'schule', text: 'Schule', selected: ed.ort === 'schule' }),
        h('option', { value: 'wohnort', text: 'Wohnort des Kindes', selected: ed.ort === 'wohnort' }),
        h('option', { value: 'anderer', text: 'Anderer Ort', selected: ed.ort === 'anderer' })
      ]));
      if (ed.ort === 'anderer') {
        pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-zielort',
          text: ed.r === 'hin' ? 'Wo genau wird das Kind abgeholt?' : 'Wohin genau wird das Kind gebracht?' }));
        pnl.appendChild(h('input', { type: 'text', id: 'ed-zielort', maxlength: '100', value: ed.zielort, autocomplete: 'off',
          placeholder: 'zum Beispiel: Kirche in Rehling', disabled: b, oninput: function (e) { ed.zielort = e.target.value; } }));
      }
      pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-fahrer', text: 'Fährt mit' }));
      var fsel = h('select', { id: 'ed-fahrer', disabled: b, onchange: function (e) { ed.fahrer = e.target.value; } }, [
        h('option', { value: '', text: 'Noch kein Fahrer', selected: !ed.fahrer })
      ]);
      fahrerListe(z, ed.r).forEach(function (f) {
        fsel.appendChild(h('option', { value: f.id, selected: ed.fahrer === f.id,
          text: f.name + (f.frei > 0 ? ' (noch ' + f.frei + ' frei)' : ' (voll)') }));
      });
      pnl.appendChild(fsel);
    } else if (ed.choice === 'anderweitig') {
      pnl.appendChild(h('p', { 'class': 'sub', style: 'margin-top:8px', text: 'Zum Beispiel, wenn das Kind nicht mitfährt.' }));
    }
    if (ed.choice) {
      var anmHinweis = ed.choice === 'selbst'
        ? 'Alle Eltern, die das Angebot sehen, lesen diesen Text.'
        : (ed.choice === 'suche' ? 'Der Fahrer, bei dem das Kind mitfährt, liest diesen Text.' : 'Nur der Elternbeirat liest diesen Text.');
      pnl.appendChild(h('label', { 'class': 'field', 'for': 'ed-anmerkung', text: 'Anmerkung (freiwillig)' }));
      var zaehler = h('div', { 'class': 'zaehler', 'aria-hidden': 'true', text: ed.anmerkung.length + ' von 200 Zeichen' });
      pnl.appendChild(h('textarea', { id: 'ed-anmerkung', maxlength: '200', rows: '3', disabled: b, 'aria-describedby': 'ed-anm-hinweis',
        text: ed.anmerkung,
        oninput: function (e) { ed.anmerkung = e.target.value; zaehler.textContent = ed.anmerkung.length + ' von 200 Zeichen'; } }));
      pnl.appendChild(zaehler);
      pnl.appendChild(h('p', { 'class': 'hint', id: 'ed-anm-hinweis', text: anmHinweis }));
    }
    dlg.appendChild(pnl);

    dlg.appendChild(h('div', { 'class': 'btnrow' }, [
      h('button', { type: 'button', 'class': 'secondary', id: 'ed-abbrechen', disabled: b, onclick: schliesseEditor, text: 'Abbrechen' }),
      h('button', { type: 'button', id: 'ed-speichern', disabled: b, onclick: editorSpeichern, text: b ? 'Einen Moment bitte.' : 'Speichern' })
    ]));

    if (aktiv) {
      var el = document.getElementById(aktiv);
      if (el && !el.disabled) el.focus();
    }
  }

  // Führt einen Admin-Aufruf aus. Jede Antwort ist die neue Übersicht.
  async function adminRpc(name, body) {
    body.p_admin_token = token;
    var data = await rpc(name, body);
    rows = baueZeilen(data);
    stand = new Date();
    render();
    return data;
  }

  function editorFehler(e) {
    if (e.kind === 'ungueltig') { codeUngueltig(); return; }
    if (e.kind === 'fehlt') e.message = 'Die Datenbankfunktionen für die Eingabe fehlen noch. Bitte spiele zuerst die Datei fg_anmerkung_zustieg_admin.sql in Supabase ein.';
    ed.msg = { type: 'err', text: e.message };
    ed.busy = false;
    renderEditor('ed-msg');
  }

  async function editorSpeichern() {
    if (!ed || ed.busy) return;
    if (!ed.choice) { ed.msg = { type: 'err', text: 'Bitte wähle eine Möglichkeit aus.' }; renderEditor('ed-msg'); return; }
    if (ed.choice === 'selbst' && ed.plaetze > 0 && !ed.orte.trim()) {
      ed.msg = { type: 'err', text: 'Bitte gib an, welche Orte angefahren werden.' };
      renderEditor('ed-orte');
      return;
    }
    if (ed.choice === 'suche' && ed.ort === 'anderer' && !ed.zielort.trim()) {
      ed.msg = { type: 'err', text: 'Bitte gib den anderen Ort an.' };
      renderEditor('ed-zielort');
      return;
    }
    var z = findRow(ed.id), r = ed.r;
    var kindId = ed.id, name = z.name;
    ed.busy = true; ed.msg = null; renderEditor('ed-speichern');
    try {
      var data = await adminRpc('fg_admin_setze_option', {
        p_kind_id: kindId, p_richtung: r, p_status: ed.choice,
        p_ort_typ: ed.choice === 'suche' ? ed.ort : 'schule',
        p_plaetze_frei: ed.choice === 'selbst' ? ed.plaetze : 0,
        p_stationen: ed.choice === 'selbst' && ed.plaetze > 0 ? ed.orte.trim() : null,
        p_ort_text: ed.choice === 'suche' && ed.ort === 'anderer' ? ed.zielort.trim()
          : (ed.choice === 'selbst' && ed.plaetze > 0 && ed.treffpunkt.trim() ? ed.treffpunkt.trim() : null),
        p_anmerkung: ed.anmerkung.trim() || null
      });
      if (ed.choice === 'suche') {
        var aktuell = findRow(kindId)[r].faehrtMitId || '';
        if (ed.fahrer && ed.fahrer !== aktuell) {
          await adminRpc('fg_admin_buche', { p_kind_id: kindId, p_richtung: r, p_fahrer_kind_id: ed.fahrer });
        } else if (!ed.fahrer && aktuell) {
          await adminRpc('fg_admin_storniere', { p_kind_id: kindId, p_richtung: r });
        }
      }
      meldung = { type: 'good', text: (r === 'hin' ? 'Hinfahrt' : 'Rückfahrt') + ' für ' + name + ' ist gespeichert.' };
      schliesseEditor();
      render();
    } catch (e) {
      editorFehler(e);
    }
  }

  async function mitfahrerEntfernen(mitKindId, mitName) {
    if (!ed || ed.busy) return;
    var r = ed.r;
    ed.busy = true; ed.msg = null; renderEditor('ed-titel');
    try {
      await adminRpc('fg_admin_storniere', { p_kind_id: mitKindId, p_richtung: r });
      ed.busy = false;
      ed.msg = { type: 'good', text: mitName + ' wurde entfernt.' };
      renderEditor('ed-msg');
    } catch (e) {
      editorFehler(e);
    }
  }

  laden();
})();
</script>
</body>
</html>
